services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - 8000:8000
    volumes:
      - .:/app
    environment:
      PORT: 8000
      ARQ_AUTOSTART_WORKER: "true"
    depends_on:
      - redis
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: python -m arq api.background_tasks.arq_worker.WorkerSettings
    volumes:
      - .:/app
    depends_on:
      - redis
  redis:
    image: redis/redis-stack-server:latest
    volumes:
      - ./redis.conf:/redis-stack.conf:ro
      - redis-data:/data
volumes:
  redis-data:
